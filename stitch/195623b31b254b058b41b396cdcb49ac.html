<!DOCTYPE html>

<html class="dark" lang="tr"><head>

<style>
        /* Base typography defaults */
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-mono-temporal {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex overflow-hidden">
<!-- Desktop SideNavBar (Hidden on Mobile) -->
<aside class="hidden md:flex flex-col w-64 h-screen border-r border-outline-variant/15 bg-background z-20">
<div class="p-8">
<h1 class="text-primary font-black text-2xl tracking-tighter">Kinetic Sayaç</h1>
<p class="text-on-surface-variant text-sm tracking-wide mt-1">Minimalist Takip</p>
</div>
<nav class="flex-1 mt-6 flex flex-col gap-1 px-4">
<!-- Inactive Tab: Sayaç -->
<a class="flex items-center gap-4 px-4 py-3 rounded-lg text-on-surface/50 hover:text-on-surface transition-all ease-in-out group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">add_circle</span>
<span class="font-label text-sm tracking-wide">Sayaç</span>
</a>
<!-- Active Tab: Geçmiş -->
<a class="flex items-center gap-4 px-4 py-3 rounded-lg bg-surface-container-low text-primary border-r-2 border-primary transition-all ease-in-out" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">history</span>
<span class="font-label text-sm tracking-wide font-bold">Geçmiş</span>
</a>
</nav>
</aside>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col relative h-screen overflow-y-auto">
<!-- Ambient Background Glow -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[500px] bg-primary-container/10 rounded-full blur-[120px] pointer-events-none"></div>
<!-- TopNavBar -->
<header class="flex justify-between items-center w-full px-6 h-16 bg-transparent relative z-20 shrink-0">
<!-- Brand visible only on mobile -->
<div class="md:hidden text-xl font-bold tracking-tighter text-on-background">SAYAÇ</div>
<div class="hidden md:block flex-1"></div>
<div class="flex items-center gap-4">
<button class="text-primary hover:bg-surface-container-highest p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined">dark_mode</span>
</button>
</div>
</header>
<!-- Page Content -->
<div class="flex-1 flex flex-col items-center justify-center px-6 pb-32 md:pb-12 z-10">
<!-- Hero Counter Area -->
<div class="mb-16 flex flex-col items-center">
<div class="text-[6rem] md:text-[8rem] font-black leading-none text-primary tracking-tighter drop-shadow-[0_0_40px_rgba(124,58,237,0.15)]">
                    0
                </div>
<div class="text-on-surface-variant font-label text-xs uppercase tracking-[0.3em] mt-4 font-medium opacity-70">
                    Güncel Sayaç
                </div>
</div>
<!-- Empty State Card -->
<div class="relative w-full max-w-md bg-surface-container-low rounded-[12px] p-10 flex flex-col items-center text-center">
<!-- Ghost Border -->
<div class="absolute inset-0 border border-outline-variant/15 rounded-[12px] pointer-events-none"></div>
<!-- Icon Container -->
<div class="w-16 h-16 rounded-[12px] bg-surface-container-highest flex items-center justify-center mb-6 shadow-[0_8px_32px_rgba(218,226,253,0.04)] relative">
<div class="absolute inset-0 border border-outline-variant/20 rounded-[12px] pointer-events-none"></div>
<span class="material-symbols-outlined text-primary text-3xl opacity-80" style="font-variation-settings: 'FILL' 0;">history</span>
</div>
<!-- Text Content -->
<h2 class="text-on-surface font-headline text-xl font-medium mb-3">Henüz işlem yapılmadı</h2>
<p class="text-on-surface-variant font-body text-sm leading-relaxed max-w-[250px]">
                    İlk işleminizi yapmak için butonları kullanın
                </p>
</div>
</div>
</main>
<!-- Mobile BottomNavBar (Hidden on Desktop) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 md:hidden bg-background/85 backdrop-blur-xl border-t border-outline-variant/10">
<!-- Inactive: Artır -->
<button class="flex flex-col items-center justify-center text-on-surface/40 hover:text-primary transition-colors gap-1 w-16">
<span class="material-symbols-outlined">add</span>
<span class="font-label text-[9px] font-medium uppercase tracking-widest">Artır</span>
</button>
<!-- Inactive: Azalt -->
<button class="flex flex-col items-center justify-center text-on-surface/40 hover:text-primary transition-colors gap-1 w-16">
<span class="material-symbols-outlined">remove</span>
<span class="font-label text-[9px] font-medium uppercase tracking-widest">Azalt</span>
</button>
<!-- Inactive: Sıfırla -->
<button class="flex flex-col items-center justify-center text-on-surface/40 hover:text-primary transition-colors gap-1 w-16">
<span class="material-symbols-outlined">restart_alt</span>
<span class="font-label text-[9px] font-medium uppercase tracking-widest">Sıfırla</span>
</button>
<!-- Active: Geçmiş -->
<button class="flex flex-col items-center justify-center bg-primary/10 text-primary rounded-[8px] px-2 py-2 scale-95 transition-transform gap-1 w-20">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">history</span>
<span class="font-label text-[9px] font-bold uppercase tracking-widest">Geçmiş</span>
</button>
</nav>
